<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
        />
        <title>CC Tracker</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="renderer.js" defer></script>
    </head>
    <body>
        <header>
            <div>
                <span class="eyebrow">A LITTLE MORE ORGANIZED</span>
                <h1>CC Tracker<span>.</span></h1>
            </div>
            <button id="settings-toggle" class="icon" aria-label="Open settings" aria-expanded="false">⚙</button>
        </header>
        <main>
            <section id="entry">
                <form id="transaction-form">
                    <label for="date">Date</label><input id="date" name="date" type="date" required />
                    <label for="bank">Bank</label
                    ><select id="bank" name="bank" required>
                        <option value="" disabled selected>Select a bank</option>
                    </select>
                    <label for="amount">Amount</label
                    ><input
                        id="amount"
                        name="amount"
                        type="text"
                        inputmode="decimal"
                        placeholder="0.00"
                        pattern="[0-9]+(\.[0-9]{1,2})?"
                        required
                        autocomplete="off"
                    />
                    <label for="description">Description</label
                    ><input
                        id="description"
                        name="description"
                        type="text"
                        placeholder="What was it for?"
                        maxlength="500"
                        required
                    />
                    <button type="submit" class="primary" id="send">
                        Send Transaction <span aria-hidden="true">↗</span>
                    </button>
                </form>
            </section>
            <section id="settings" hidden>
                <div class="section-heading"><h2>Settings</h2></div>
                <p class="help">Transactions are sent as JSON to this address. Settings are saved on this device.</p>
                <form id="settings-form">
                    <label for="endpoint">Endpoint URL</label
                    ><input id="endpoint" type="url" placeholder="https://example.com/transactions" /><label for="banks"
                        >Banks</label
                    ><textarea
                        id="banks"
                        rows="3"
                        required
                        aria-describedby="banks-help"
                        placeholder="Bank name, Another bank"
                    ></textarea>
                    <p id="banks-help" class="field-help">Separate bank names with commas.</p>
                    <button class="primary" type="submit">Save Settings <span aria-hidden="true">✓</span></button
                    ><button class="secondary" type="button" id="back">Back to transaction</button>
                </form>
            </section>
            <p id="status" role="status" aria-live="polite"></p>
        </main>
        <footer><span id="connection-dot" class="dot"></span><span id="connection">Loading settings…</span></footer>
    </body>
</html>
