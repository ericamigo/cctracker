name: Build installers

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            args: --mac --x64 --arm64
            artifacts: dist/*.dmg
          - platform: Windows
            os: windows-latest
            args: --win --x64
            artifacts: dist/*.exe
          - platform: Fedora
            os: ubuntu-latest
            args: --linux --x64
            artifacts: dist/*.rpm
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set installer version from tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --ignore-scripts --allow-same-version
      - name: Test
        run: npm test
      - name: Install RPM packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm libcrypt1
      - name: Build installers
        shell: bash
        env:
          BUILD_ARGS: ${{ matrix.args }}
        run: npm run dist -- $BUILD_ARGS
      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Attach installers to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            release_args=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG" "${release_args[@]}"
          fi
          gh release upload "$RELEASE_TAG" installers/* --clobber
